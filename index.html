<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- %BASE_URL% resolves to Vite's base ("/pinochle/") so these public assets
         load correctly under the project-page subdirectory. Icons are generated
         from the app icon by scripts/optimize-assets.mjs. -->
    <link
      rel="icon"
      type="image/png"
      href="%BASE_URL%favicon-32.png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon.png"
    />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#0b0b12" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Pinochle" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&display=swap"
    />
    <meta
      name="description"
      content="Pinochle: Two-Handed — the classic two-handed card duel for iPhone, iPad, Mac, and Apple TV. Official Bicycle rules, three AI opponents, Game Center online play, and SharePlay."
    />
    <meta property="og:title" content="Pinochle: Two-Handed" />
    <meta
      property="og:description"
      content="The classic two-handed card duel for iPhone, iPad, Mac, and Apple TV."
    />
    <meta property="og:type" content="website" />
    <title>Pinochle: Two-Handed</title>
    <script>
      // Resolve the theme before first paint so the initial background below
      // matches the React app — eliminates the white flicker before the bundled
      // CSS / React mounts.
      (function () {
        try {
          var stored = localStorage.getItem("pinochle-theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
    <style>
      /* Initial loading background, mirrored from index.css (bg-white /
         dark:bg-zinc-950) so the page is painted in the right color before the
         bundled stylesheet loads. Keep these values in sync with index.css. */
      html {
        background-color: #ffffff;
      }
      html.dark {
        background-color: oklch(14.1% 0.005 285.823);
      }
    </style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Converts the ?/ redirect written by 404.html back into the real URL and
      // replaces it in history so the SPA router can pick it up.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
